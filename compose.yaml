# Hostinger KVM VPS: Docker containers, NOT nested virtual machines.
# Change secrets and configure reverse-proxy HTTPS before public exposure.
services:
  api:
    build: .
    restart: unless-stopped
    init: true
    logging:
      driver: json-file
      options:
        max-size: '5m'
        max-file: '3'
    env_file: .env
    environment:
      POLSIADB: /srv/data/polsia.db
      POLSIA_LOCAL_AI_URL: http://ollama:11434
    ports:
      - '127.0.0.1:8080:8080'
    volumes:
      - state:/srv/data
    cpus: '0.50'
    mem_limit: 384m
    memswap_limit: 512m
    pids_limit: 100
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  worker:
    build: .
    restart: unless-stopped
    init: true
    logging:
      driver: json-file
      options:
        max-size: '5m'
        max-file: '3'
    env_file: .env
    environment:
      POLSIADB: /srv/data/polsia.db
      POLSIA_LOCAL_AI_URL: http://ollama:11434
    command: ["python","-m","app.worker","--poll-seconds","5"]
    volumes:
      - state:/srv/data
    cpus: '0.60'
    mem_limit: 768m
    memswap_limit: 1024m
    pids_limit: 100
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  # Optional, entirely local inference service. NOT exposed on a public port.
  # Pull weights manually after checking model license, size, and VPS capacity.
  ollama:
    image: ollama/ollama:latest  # Pin by digest for audited production use.
    profiles: [local-ai]
    restart: unless-stopped
    init: true
    volumes:
      - models:/root/.ollama
    environment:
      OLLAMA_HOST: '0.0.0.0:11434'
      OLLAMA_NO_CLOUD: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_QUEUE: '4'
    cpus: '1.0'
    mem_limit: 3072m
    memswap_limit: 3584m
    pids_limit: 128
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: '5m'
        max-file: '3'
volumes:
  state:
  models:
