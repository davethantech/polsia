name: Unit tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test requirements
        run: python -m pip install -r requirements.txt
      - name: Run tests (no live API credentials)
        env:
          POLSIA_NETWORK_ENABLED: '0'
          POLSIA_AI_ENABLED: '0'
          POLSIA_CULTURE_REFRESH_ENABLED: '0'
        run: python -m pytest -q
